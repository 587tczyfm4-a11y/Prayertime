name: Horaires de prière

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer un message de test immédiatement (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python prayer_bot.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
          CITY: ${{ vars.CITY }}
          TEST_MODE: ${{ github.event.inputs.test || 'false' }}
      - name: Sauvegarder l'état anti-doublon si modifié
        run: |
          if [ -n "$(git status --porcelain last_sent.json 2>/dev/null)" ]; then
            git config user.name "prayer-bot"
            git config user.email "prayer-bot@users.noreply.github.com"
            git add last_sent.json
            git commit -m "Mise à jour état prières envoyées"
            git push
          else
            echo "Aucun changement à sauvegarder"
          fi
