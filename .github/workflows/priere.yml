name: Horaires de prière

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer un message de test immédiatement (true/false)'
        required: false
        default: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python prayer_bot.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
          CITY: ${{ vars.CITY }}
          TEST_MODE: ${{ github.event.inputs.test || 'false' }}
